[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hands-on-systems-science"
version = "0.1.0"
description = "动手学系统科学的轻量教学辅助工具"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
learn = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8"]
dev = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "nbconvert>=7.16,<8", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systems_science = ["theme.json"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
