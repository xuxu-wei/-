<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临界变化与韧性 · 可视化与探索</title><link rel="stylesheet" href="/web/shared/theme.css"><link rel="stylesheet" href="/web/shared/course-shell.css"><link rel="stylesheet" href="/web/resilience/style.css"></head>
<body><main id="main"><div id="loading-note" class="notice" role="status">正在准备韧性实验…</div>
<article class="exploration" hidden><header class="intro"><p id="eyebrow" class="eyebrow"></p><h1 id="title"></h1><p id="question" class="lead" data-teaching></p></header>

<div id="legend" class="chart-legend"></div><p id="chart-note" class="caption" data-teaching></p>
<div class="play-controls"><button id="play" type="button" class="primary" disabled>播放</button><button id="replay" type="button" disabled>从头重播</button><output id="play-counter" aria-live="off"></output><label for="timeline">观察位置</label><input id="timeline" type="range" min="0" max="100" step=".1" value="100" disabled></div><p id="play-status" class="caption" role="status"></p>
