<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统随时间演化 · 可视化与探索</title><link rel="stylesheet" href="/web/shared/theme.css"><link rel="stylesheet" href="/web/shared/course-shell.css"><link rel="stylesheet" href="/web/time-evolution/style.css"></head>
<body><main id="main">
<div id="loading-note" class="notice" role="status">正在准备模型与图形…</div>
<article class="exploration" hidden>
  <header class="intro"><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="question" class="lead" data-teaching></p></header>
  <div class="explore-grid">
    <section class="model-panel"><h2>先预测，再改变条件</h2><p id="explanation" data-teaching></p><p id="formula" class="formula"></p>
      <div id="mechanism" class="mechanism"></div>
      <fieldset id="controls" disabled><legend>实验条件</legend><div id="sliders"></div><div class="presets"><button id="alternate" type="button"></button><button id="reset" type="button">恢复起始条件</button></div></fieldset>
      <p id="preset-note" class="caption"></p><p id="assumptions" class="caption" data-teaching></p>
    </section>
    <section class="chart-panel"><div class="chart-heading"><h2>过程与参照</h2><span id="time-readout" class="time-readout"></span></div>
      <div class="readouts"><div><span id="value-label"></span><strong id="value"></strong></div><p id="observation"></p></div>
      <svg id="chart" viewBox="0 0 800 380" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">总量随时间变化</title><desc id="svg-desc"></desc></svg>
      <div id="legend" class="chart-legend"></div>
      <div class="play-controls"><button id="play" class="primary" type="button" disabled>播放</button><button id="replay" type="button" disabled>从头重播</button><output id="play-counter" aria-live="off"></output><label for="timeline">观察位置</label><input id="timeline" type="range" min="0" max="12" step="0.01" value="0" disabled></div>
      <p id="play-status" class="caption" role="status"></p><p id="model-warning" class="notice error" hidden></p>
      <details class="values"><summary>展开当前条件的数值对照</summary><p class="caption">表格显示最多六位小数；模型计算保留完整精度。离散点之间的连线仅辅助阅读。</p><div id="value-table"></div></details>
    </section>
  </div>
  <section class="reading"><h2>继续推导与完整实验</h2><p id="reading-prompt"></p><div id="notebooks" class="reading-links"></div><p id="open-status" role="status"></p></section>
</article></main><script src="/web/shared/boot.js"></script><script type="module" src="/web/time-evolution/app.mjs" data-main></script></body></html>
